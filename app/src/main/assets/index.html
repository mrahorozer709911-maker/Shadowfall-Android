<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#100d1c"><title>Shadowfall</title>
<style>
*{box-sizing:border-box;touch-action:manipulation}body{margin:0;background:#100d1c;color:#f3edff;font-family:system-ui,Arial;overflow:hidden}#top{height:64px;padding:8px 12px;background:#1b1530;border-bottom:1px solid #4d386e;display:flex;justify-content:space-between;gap:8px;align-items:center}h1{font-size:18px;margin:0;color:#d6b4ff}small{color:#b9a9d4}button{background:#5e35a6;color:white;border:1px solid #a17de0;border-radius:12px;padding:10px 12px;font-weight:700}#stats{font-size:12px;line-height:1.5}#game{display:block;width:100vw;height:calc(100dvh - 154px);background:radial-gradient(ellipse,#27203b,#0e0c16)}#bottom{height:90px;display:flex;justify-content:space-around;align-items:center;background:#1b1530;border-top:1px solid #4d386e;padding:5px}.skill{width:54px;height:54px;border-radius:50%;font-size:11px;padding:4px;background:#39234f}#joystick{position:absolute;left:18px;bottom:102px;width:100px;height:100px;border-radius:50%;background:#ffffff16;border:2px solid #b9a0db66}#knob{position:absolute;left:27px;top:27px;width:42px;height:42px;border-radius:50%;background:#cbb4ed99;border:2px solid #e7d9ff}#hint{position:absolute;left:0;right:0;top:70px;text-align:center;font-size:11px;color:#d0c2e5;pointer-events:none}#toast{position:absolute;top:105px;left:50%;transform:translateX(-50%);background:#271a3b;padding:8px 12px;border-radius:12px;border:1px solid #a17de0;display:none;z-index:2}#overlay{position:absolute;inset:0;background:#0d0917ef;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:3}.card{max-width:350px;background:#211733;border:1px solid #7d58ad;border-radius:20px;padding:22px;box-shadow:0 10px 50px #000}.card h2{color:#d6b4ff}.card p{line-height:1.5;color:#ded3f1}
</style></head><body>
<div id="top"><div><h1>SHADOWFALL</h1><small>Тёмное подземелье</small></div><div id="stats">Ур. 1 · XP 0/50<br>HP 100/100 · Монеты 0</div><button id="bag">🎒</button></div>
<canvas id="game"></canvas><div id="hint">Двигай джойстик • касайся врагов для атаки</div><div id="toast"></div><div id="joystick"><div id="knob"></div></div>
<div id="bottom"><button id="attack">⚔️<br>Атака</button><button class="skill" data-skill="0">✦<br>Взрыв</button><button class="skill" data-skill="1">❄<br>Лёд</button><button class="skill" data-skill="2">✚<br>Лечение</button><button class="skill" data-skill="3">☄<br>Метеор</button></div>
<div id="overlay"><div class="card"><h2>Shadowfall</h2><p>Уничтожай монстров, собирай добычу и повышай уровень героя.</p><button id="start">НАЧАТЬ ИГРУ</button></div></div>
<script>
(function(){
var c=document.getElementById('game'),ctx=c.getContext('2d'),stats=document.getElementById('stats'),toast=document.getElementById('toast');
var W=0,H=0,player={x:0,y:0,r:14,hp:100,max:100,xp:0,level:1,coins:0},enemies=[],loot=[],keys={x:0,y:0},last=0,attackCd=0,nowAttackUntil=0,skillCd=[0,0,0,0],running=false,bossSpawnedAt=0;
function resize(){var dpr=Math.min(window.devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!player.x){player.x=W/2;player.y=H/2}}
window.addEventListener('resize',resize);resize();
function say(s){toast.textContent=s;toast.style.display='block';clearTimeout(say.t);say.t=setTimeout(function(){toast.style.display='none'},1400)}
function spawn(){var a=Math.random()*Math.PI*2,d=170+Math.random()*130;enemies.push({x:player.x+Math.cos(a)*d,y:player.y+Math.sin(a)*d,r:12+Math.random()*4,hp:35+player.level*7,max:35+player.level*7,speed:22+Math.random()*15,hit:0,boss:false})}
function spawnBoss(){if(bossSpawnedAt===player.level)return;bossSpawnedAt=player.level;var a=Math.random()*Math.PI*2;var hp=260+player.level*35;enemies.push({x:player.x+Math.cos(a)*230,y:player.y+Math.sin(a)*230,r:25,hp:hp,max:hp,speed:17,hit:0,boss:true});say('БОСС ПОДЗЕМЕЛЬЯ ПРИБЛИЖАЕТСЯ!')}
for(var i=0;i<5;i++)spawn();
function statsUpdate(){stats.innerHTML='Ур. '+player.level+' · XP '+player.xp+'/'+(player.level*50)+'<br>HP '+Math.ceil(player.hp)+'/'+player.max+' · Монеты '+player.coins+'<br>'+(player.level>=5?'Боссы каждые 5 уровней':'До босса: '+(5-player.level)+' ур.')}
function hitEnemy(e,dmg){e.hp-=dmg;e.hit=.15;loot.push({x:e.x+(Math.random()*16-8),y:e.y+(Math.random()*16-8),r:3,type:'spark',life:.18});if(e.hp<=0){enemies=enemies.filter(function(x){return x!==e});player.xp+=e.boss?100:15;if(e.boss){player.coins+=15;say('БОСС ПОБЕЖДЁН! +15 монет')}else if(Math.random()<.45)player.coins++;if(Math.random()<.35)loot.push({x:e.x,y:e.y,r:7,type:Math.random()<.6?'potion':'gem'});if(player.xp>=player.level*50){player.xp-=player.level*50;player.level++;player.max+=15;player.hp=player.max;say('Новый уровень! '+player.level);if(player.level%5===0)spawnBoss()}statsUpdate();spawn()}}
function nearest(){var best=null,bd=1e9;enemies.forEach(function(e){var d=Math.hypot(e.x-player.x,e.y-player.y);if(d<bd){bd=d;best=e}});return best}
function attack(){var now=performance.now()/1000;if(now<attackCd)return;attackCd=now+.38;nowAttackUntil=performance.now()+140;var e=nearest();if(e&&Math.hypot(e.x-player.x,e.y-player.y)<75){hitEnemy(e,22+player.level*3);say('Удар!')}else say('Подойди ближе к монстру')}
document.getElementById('attack').onclick=attack;
document.querySelectorAll('.skill').forEach(function(b){b.onclick=function(){var i=+b.dataset.skill,now=performance.now()/1000;if(now<skillCd[i]){say('Умение перезаряжается');return}skillCd[i]=now+[4,5,8,10][i];if(i===2){player.hp=Math.min(player.max,player.hp+35);say('Здоровье восстановлено')}else{var range=i===3?190:115;enemies.slice().filter(function(e){return Math.hypot(e.x-player.x,e.y-player.y)<range}).forEach(function(e){hitEnemy(e,[32,24,0,48][i]+player.level*3)});say(['Магический взрыв!','Ледяной удар!','','Метеорит!'][i]||'Умение!')}statsUpdate()}}});
document.getElementById('bag').onclick=function(){say('Сумка: зелья лечат, кристаллы дают монеты')};
var joy=document.getElementById('joystick'),knob=document.getElementById('knob'),active=false,cx=0,cy=0;
function joyMove(ev){if(!active)return;var p=ev;var dx=p.clientX-cx,dy=p.clientY-cy,l=Math.hypot(dx,dy),max=34;if(l>max){dx=dx/l*max;dy=dy/l*max}keys.x=dx/max;keys.y=dy/max;knob.style.transform='translate('+dx+'px,'+dy+'px)'}
function joyEnd(){active=false;keys.x=keys.y=0;knob.style.transform='translate(0,0)'}
joy.addEventListener('pointerdown',function(e){active=true;var r=joy.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',joyMove);joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
c.addEventListener('pointerdown',function(e){var r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;var hit=enemies.find(function(en){return Math.hypot(en.x-x,y-(en.y-player.y+H/2))<en.r+20});if(hit)hitEnemy(hit,28+player.level*3)});
function pixel(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function drawHero(x,y,step){var phase=Math.sin(step*9),bob=Math.abs(phase)*1.4,leg=Math.round(phase*2),swing=Math.sin(step*8);pixel(x-10,y+7,20,6,'#171520');pixel(x-8,y+5+bob,16,5,'#3a274e');pixel(x-7,y-1+bob,14,10,'#503078');pixel(x-8,y+1+bob,4,7,'#bd91f0');pixel(x+4,y+1+bob,4,7,'#bd91f0');pixel(x-6,y-8+bob,12,10,'#e8bd98');pixel(x-7,y-11+bob,14,5,'#33213f');pixel(x-8,y-12+bob,7,4,'#a47be0');pixel(x+1,y-5+bob,4,3,'#2b1830');pixel(x-4,y-3+bob,4,2,'#f5e3c8');pixel(x-7+leg,y+11+bob,5,5,'#30213d');pixel(x+2-leg,y+11+bob,5,5,'#30213d');pixel(x-9+leg,y+15+bob,7,3,'#8b6a53');pixel(x+1-leg,y+15+bob,7,3,'#8b6a53');pixel(x+7,y-1+bob+Math.round(swing),4,8,'#bd91f0');pixel(x+10,y-5+bob+Math.round(swing),3,11,'#d5e4f7');pixel(x+9,y-8+bob+Math.round(swing),5,4,'#fff4cf');pixel(x+12,y-9+bob+Math.round(swing),2,9,'#9aa8c9');if(nowAttackUntil>performance.now()){ctx.fillStyle='#f8e7ff';ctx.fillRect(x+14,y-10,5,16);ctx.fillStyle='#b9f1ff';ctx.fillRect(x+19,y-6,4,8)}}
function drawMob(e,t){var x=e.x,y=e.y,r=e.r,bob=Math.sin(t/150+e.x)*2;pixel(x-r,y+r-3,2*r,4,'#211522');if(e.boss){pixel(x-20,y-18+bob,40,32,e.hit>0?'#fff1cf':'#9b382d');pixel(x-16,y-23+bob,10,9,'#e56b35');pixel(x+6,y-23+bob,10,9,'#e56b35');pixel(x-12,y-9+bob,7,6,'#ffd66b');pixel(x+5,y-9+bob,7,6,'#ffd66b');pixel(x-7,y+5+bob,14,5,'#4b202c');pixel(x-24,y-22+bob,5,15,'#d95b35');pixel(x+19,y-22+bob,5,15,'#d95b35')}else{var col=e.hit>0?'#fff1fa':'#8b3d70';pixel(x-10,y-9+bob,20,18,col);pixel(x-7,y-14+bob,14,6,'#b45a8e');pixel(x-7,y-2+bob,4,4,'#fff0b5');pixel(x+3,y-2+bob,4,4,'#fff0b5');pixel(x-6,y+9+bob,5,5,'#5a294f');pixel(x+2,y+9+bob,5,5,'#5a294f')}pixel(x-r,y-r-10,2*r,4,'#261721');pixel(x-r,y-r-10,2*r*Math.max(0,e.hp/e.max),4,e.boss?'#ff9b43':'#fa658d');if(e.boss){ctx.strokeStyle='#ffd36b';ctx.lineWidth=2;ctx.strokeRect(x-r-3,y-r-3,2*r+6,2*r+6)}}
function draw(t){ctx.clearRect(0,0,W,H);ctx.fillStyle='#171625';ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(W/2-player.x,H/2-player.y);
var left=player.x-W/2-48,right=player.x+W/2+48,top=player.y-H/2-48,bottom=player.y+H/2+48;
for(var y=Math.floor(top/48)*48;y<bottom;y+=48){for(var x=Math.floor(left/48)*48;x<right;x+=48){var shade=((Math.floor(x/48)*7+Math.floor(y/48)*13)%5);pixel(x,y,47,47,shade===0?'#292638':shade===1?'#242333':'#272536');pixel(x+5,y+7,2,2,'#343043');if((Math.floor(x/48)+Math.floor(y/48))%4===0)pixel(x+31,y+29,7,2,'#201f2e');if((Math.floor(x/48)*3+Math.floor(y/48))%7===0){pixel(x+12,y+31,9,2,'#3b3545');pixel(x+17,y+33,2,5,'#3b3545')}}}
for(var i=0;i<8;i++){var wx=((i*137+220)%Math.max(300,W+180))+player.x-W/2-90,wy=((i*91+110)%Math.max(300,H+180))+player.y-H/2-90;pixel(wx,wy,18,12,'#393246');pixel(wx+3,wy-3,12,4,'#484052');pixel(wx+5,wy+12,4,3,'#191824')}
loot.forEach(function(l){if(l.type==='spark'){pixel(l.x-2,l.y-2,4,4,'#fff0b8');return}if(l.type==='potion'){pixel(l.x-5,l.y-5,10,11,'#65e0a5');pixel(l.x-2,l.y-8,4,3,'#d4f8e7');pixel(l.x-2,l.y-2,4,5,'#e8fff4')}else{pixel(l.x-5,l.y-4,10,8,'#6bdcff');pixel(l.x-2,l.y-7,5,3,'#d8f8ff');pixel(l.x-2,l.y+4,5,3,'#368bbf')}});
enemies.forEach(function(e){drawMob(e,t)});
drawHero(player.x,player.y,t/1000);
ctx.restore();ctx.fillStyle='#221c2e';ctx.fillRect(12,12,124,10);ctx.fillStyle='#e95b82';ctx.fillRect(14,14,120*Math.max(0,player.hp/player.max),6);ctx.strokeStyle='#b99bdc';ctx.strokeRect(12,12,124,10);ctx.fillStyle='#eee4ff';ctx.font='bold 10px system-ui';ctx.textAlign='left';ctx.fillText('HP '+Math.ceil(player.hp)+'/'+player.max,14,35)}
function frame(t){var dt=Math.min((t-last)/1000,.04)||0;last=t;if(running){player.x+=keys.x*180*dt;player.y+=keys.y*180*dt;enemies.forEach(function(e){var dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;if(d>player.r+e.r){e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}else{player.hp-=7*dt;if(player.hp<=0){player.hp=0;running=false;document.querySelector('#overlay .card h2').textContent='Герой пал';document.querySelector('#overlay .card p').textContent='Попробуй ещё раз. Твой уровень: '+player.level;document.getElementById('start').textContent='ИГРАТЬ СНОВА';document.getElementById('overlay').style.display='flex'}statsUpdate()}if(e.hit>0)e.hit-=dt});loot.slice().forEach(function(l){if(l.type==='spark'){if(l.life===undefined)l.life=.18;l.life-=dt;if(l.life<=0)loot=loot.filter(function(x){return x!==l});return}if(Math.hypot(l.x-player.x,l.y-player.y)<28){loot=loot.filter(function(x){return x!==l});if(l.type==='potion'){player.hp=Math.min(player.max,player.hp+20);say('+20 здоровья')}else{player.coins+=3;say('+3 монеты')}statsUpdate()}});draw(t)}requestAnimationFrame(frame)}
document.getElementById('start').onclick=function(){document.getElementById('overlay').style.display='none';if(player.hp<=0){player={x:W/2,y:H/2,r:14,hp:100,max:100,xp:0,level:1,coins:0};enemies=[];loot=[];bossSpawnedAt=0;for(var i=0;i<5;i++)spawn();statsUpdate()}running=true};
statsUpdate();requestAnimationFrame(frame);
})();
</script></body></html>
