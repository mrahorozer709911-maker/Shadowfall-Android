<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#100d1c"><title>Shadowfall</title>
<style>
*{box-sizing:border-box;touch-action:manipulation}body{margin:0;background:#100d1c;color:#f3edff;font-family:system-ui,Arial;overflow:hidden}#top{height:64px;padding:8px 12px;background:#1b1530;border-bottom:1px solid #4d386e;display:flex;justify-content:space-between;gap:8px;align-items:center}h1{font-size:18px;margin:0;color:#d6b4ff}small{color:#b9a9d4}button{background:#5e35a6;color:white;border:1px solid #a17de0;border-radius:12px;padding:10px 12px;font-weight:700}#stats{font-size:12px;line-height:1.5}#game{display:block;width:100vw;height:calc(100dvh - 154px);background:radial-gradient(ellipse,#27203b,#0e0c16)}#bottom{height:90px;display:flex;justify-content:space-around;align-items:center;background:#1b1530;border-top:1px solid #4d386e;padding:5px}.skill{width:54px;height:54px;border-radius:50%;font-size:11px;padding:4px;background:#39234f}#joystick{position:absolute;left:18px;bottom:102px;width:100px;height:100px;border-radius:50%;background:#ffffff16;border:2px solid #b9a0db66}#knob{position:absolute;left:27px;top:27px;width:42px;height:42px;border-radius:50%;background:#cbb4ed99;border:2px solid #e7d9ff}#hint{position:absolute;left:0;right:0;top:70px;text-align:center;font-size:11px;color:#d0c2e5;pointer-events:none}#toast{position:absolute;top:105px;left:50%;transform:translateX(-50%);background:#271a3b;padding:8px 12px;border-radius:12px;border:1px solid #a17de0;display:none;z-index:2}#overlay{position:absolute;inset:0;background:#0d0917ef;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:3}.card{max-width:350px;background:#211733;border:1px solid #7d58ad;border-radius:20px;padding:22px;box-shadow:0 10px 50px #000}.card h2{color:#d6b4ff}.card p{line-height:1.5;color:#ded3f1}
</style></head><body>
<div id="top"><div><h1>SHADOWFALL</h1><small>Тёмное подземелье</small></div><div id="stats">Ур. 1 · XP 0/50<br>HP 100/100 · Монеты 0</div><button id="bag">🎒</button></div>
<canvas id="game"></canvas><div id="hint">Двигай джойстик • касайся врагов для атаки</div><div id="toast"></div><div id="joystick"><div id="knob"></div></div>
<div id="bottom"><button id="attack">⚔️<br>Атака</button><button class="skill" data-skill="0">✦<br>Взрыв</button><button class="skill" data-skill="1">❄<br>Лёд</button><button class="skill" data-skill="2">✚<br>Лечение</button><button class="skill" data-skill="3">☄<br>Метеор</button></div>
<div id="overlay"><div class="card"><h2>Shadowfall</h2><p>Уничтожай монстров, собирай добычу и повышай уровень героя.</p><button id="start">НАЧАТЬ ИГРУ</button></div></div>
<script>
(function(){
var c=document.getElementById('game'),ctx=c.getContext('2d'),stats=document.getElementById('stats'),toast=document.getElementById('toast');
var W=0,H=0,player={x:0,y:0,r:14,hp:100,max:100,xp:0,level:1,coins:0},enemies=[],loot=[],keys={x:0,y:0},last=0,attackCd=0,skillCd=[0,0,0,0],running=false,bossSpawnedAt=0;
function resize(){var dpr=Math.min(window.devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!player.x){player.x=W/2;player.y=H/2}}
window.addEventListener('resize',resize);resize();
function say(s){toast.textContent=s;toast.style.display='block';clearTimeout(say.t);say.t=setTimeout(function(){toast.style.display='none'},1400)}
function spawn(){var a=Math.random()*Math.PI*2,d=170+Math.random()*130;enemies.push({x:player.x+Math.cos(a)*d,y:player.y+Math.sin(a)*d,r:12+Math.random()*4,hp:35+player.level*7,max:35+player.level*7,speed:22+Math.random()*15,hit:0,boss:false})}\nfunction spawnBoss(){if(bossSpawnedAt===player.level)return;bossSpawnedAt=player.level;var a=Math.random()*Math.PI*2;var hp=260+player.level*35;enemies.push({x:player.x+Math.cos(a)*230,y:player.y+Math.sin(a)*230,r:25,hp:hp,max:hp,speed:17,hit:0,boss:true});say('БОСС ПОДЗЕМЕЛЬЯ ПРИБЛИЖАЕТСЯ!')}
for(var i=0;i<5;i++)spawn();
function statsUpdate(){stats.innerHTML='Ур. '+player.level+' · XP '+player.xp+'/'+(player.level*50)+'<br>HP '+Math.ceil(player.hp)+'/'+player.max+' · Монеты '+player.coins+'<br>'+(player.level>=5?'Боссы каждые 5 уровней':'До босса: '+(5-player.level)+' ур.')}
function hitEnemy(e,dmg){e.hp-=dmg;e.hit=.15;if(e.hp<=0){enemies=enemies.filter(function(x){return x!==e});player.xp+=e.boss?100:15;if(e.boss){player.coins+=15;say('БОСС ПОБЕЖДЁН! +15 монет')}else if(Math.random()<.45)player.coins++;if(Math.random()<.35)loot.push({x:e.x,y:e.y,r:7,type:Math.random()<.6?'potion':'gem'});if(player.xp>=player.level*50){player.xp-=player.level*50;player.level++;player.max+=15;player.hp=player.max;say('Новый уровень! '+player.level);if(player.level%5===0)spawnBoss()}statsUpdate();spawn()}}
function nearest(){var best=null,bd=1e9;enemies.forEach(function(e){var d=Math.hypot(e.x-player.x,e.y-player.y);if(d<bd){bd=d;best=e}});return best}
function attack(){var now=performance.now()/1000;if(now<attackCd)return;attackCd=now+.38;var e=nearest();if(e&&Math.hypot(e.x-player.x,e.y-player.y)<75){hitEnemy(e,22+player.level*3);say('Удар!')}else say('Подойди ближе к монстру')}
document.getElementById('attack').onclick=attack;
document.querySelectorAll('.skill').forEach(function(b){b.onclick=function(){var i=+b.dataset.skill,now=performance.now()/1000;if(now<skillCd[i]){say('Умение перезаряжается');return}skillCd[i]=now+[4,5,8,10][i];if(i===2){player.hp=Math.min(player.max,player.hp+35);say('Здоровье восстановлено')}else{var range=i===3?190:115;enemies.slice().filter(function(e){return Math.hypot(e.x-player.x,e.y-player.y)<range}).forEach(function(e){hitEnemy(e,[32,24,0,48][i]+player.level*3)});say(['Магический взрыв!','Ледяной удар!','','Метеорит!'][i]||'Умение!')}statsUpdate()}}});
document.getElementById('bag').onclick=function(){say('Сумка: зелья лечат, кристаллы дают монеты')};
var joy=document.getElementById('joystick'),knob=document.getElementById('knob'),active=false,cx=0,cy=0;
function joyMove(ev){if(!active)return;var p=ev;var dx=p.clientX-cx,dy=p.clientY-cy,l=Math.hypot(dx,dy),max=34;if(l>max){dx=dx/l*max;dy=dy/l*max}keys.x=dx/max;keys.y=dy/max;knob.style.transform='translate('+dx+'px,'+dy+'px)'}
function joyEnd(){active=false;keys.x=keys.y=0;knob.style.transform='translate(0,0)'}
joy.addEventListener('pointerdown',function(e){active=true;var r=joy.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2;joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',joyMove);joy.addEventListener('pointerup',joyEnd);joy.addEventListener('pointercancel',joyEnd);
c.addEventListener('pointerdown',function(e){var r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;var hit=enemies.find(function(en){return Math.hypot(en.x-x,y-(en.y-player.y+H/2))<en.r+20});if(hit)hitEnemy(hit,28+player.level*3)});
function draw(){ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(W/2-player.x,H/2-player.y);ctx.strokeStyle='#423252';for(var x=-1000;x<2000;x+=48){ctx.beginPath();ctx.moveTo(x,-1000);ctx.lineTo(x,2000);ctx.stroke()}for(var y=-1000;y<2000;y+=48){ctx.beginPath();ctx.moveTo(-1000,y);ctx.lineTo(2000,y);ctx.stroke()}
loot.forEach(function(l){ctx.fillStyle=l.type==='potion'?'#53e0a2':'#65d9ff';ctx.beginPath();ctx.arc(l.x,l.y,l.r,0,7);ctx.fill()});
enemies.forEach(function(e){ctx.fillStyle=e.hit>0?'#fff':(e.boss?'#ff8a32':'#a83c62');ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();if(e.boss){ctx.strokeStyle='#ffd36b';ctx.lineWidth=3;ctx.beginPath();ctx.arc(e.x,e.y,e.r+5,0,7);ctx.stroke();ctx.lineWidth=1;}ctx.fillStyle='#29101d';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,4);ctx.fillStyle='#ff6c86';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*Math.max(0,e.hp/e.max),4);ctx.fillStyle='#fff';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText('✦',e.x,e.y+4)});
ctx.fillStyle='#c8a5ff';ctx.beginPath();ctx.arc(player.x,player.y,player.r+5,0,7);ctx.fill();ctx.fillStyle='#f4eaff';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,7);ctx.fill();ctx.fillStyle='#8d5ad3';ctx.beginPath();ctx.arc(player.x+4,player.y-3,4,0,7);ctx.fill();ctx.restore();ctx.fillStyle='#2d203b';ctx.fillRect(12,12,120,8);ctx.fillStyle='#e95b82';ctx.fillRect(12,12,120*player.hp/player.max,8);ctx.strokeStyle='#b99bdc';ctx.strokeRect(12,12,120,8)}
function frame(t){var dt=Math.min((t-last)/1000,.04)||0;last=t;if(running){player.x+=keys.x*180*dt;player.y+=keys.y*180*dt;enemies.forEach(function(e){var dx=player.x-e.x,dy=player.y-e.y,d=Math.hypot(dx,dy)||1;if(d>player.r+e.r){e.x+=dx/d*e.speed*dt;e.y+=dy/d*e.speed*dt}else{player.hp-=7*dt;if(player.hp<=0){player.hp=0;running=false;document.querySelector('#overlay .card h2').textContent='Герой пал';document.querySelector('#overlay .card p').textContent='Попробуй ещё раз. Твой уровень: '+player.level;document.getElementById('start').textContent='ИГРАТЬ СНОВА';document.getElementById('overlay').style.display='flex'}statsUpdate()}if(e.hit>0)e.hit-=dt});loot.slice().forEach(function(l){if(Math.hypot(l.x-player.x,l.y-player.y)<28){loot=loot.filter(function(x){return x!==l});if(l.type==='potion'){player.hp=Math.min(player.max,player.hp+20);say('+20 здоровья')}else{player.coins+=3;say('+3 монеты')}statsUpdate()}});draw()}requestAnimationFrame(frame)}
document.getElementById('start').onclick=function(){document.getElementById('overlay').style.display='none';if(player.hp<=0){player={x:W/2,y:H/2,r:14,hp:100,max:100,xp:0,level:1,coins:0};enemies=[];loot=[];bossSpawnedAt=0;for(var i=0;i<5;i++)spawn();statsUpdate()}running=true};
statsUpdate();requestAnimationFrame(frame);
})();
</script></body></html>
